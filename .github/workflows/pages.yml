name: Deploy public play site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: progressive-pages
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      archive_only: ${{ steps.mode.outputs.archive_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: mode
        shell: bash
        run: |
          if test -f archive-delivery.json; then
            mode=$(python scripts/validate_archive_delivery.py --mode classify --repository . --candidate-sha "$GITHUB_SHA")
            if test "$mode" = archive; then
              echo 'archive_only=true' >> "$GITHUB_OUTPUT"
            else
              echo 'archive_only=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'archive_only=false' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: classify
    if: needs.classify.outputs.archive_only == 'false'
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install release validator dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          python-chess==1.999 chess==1.11.2

      - name: Validate public runtime contract
        shell: python
        run: |
          from pathlib import Path

          root = Path("src/scottish_progressive/web/static")
          index = (root / "index.html").read_text(encoding="utf-8")
          app = (root / "app.js").read_text(encoding="utf-8")
          required = [
              "styles.css",
              "study-safety.js",
              "evaluation-format.js",
              "play-handoff.js",
              "play-timeline.js",
              "browser-prefix-contract.js",
              "root-iteration-coordinator.js",
              "browser-root-iteration-client.js",
              "browser-engine-client.js",
              "board-renderer.js",
              "matches.html",
              "match-viewer.js",
              "matches/match-viewer-manifest.json",
              "browser-engine-worker.js",
              "wasm-kernel-adapter.js",
              "engine/browser-engine-manifest.json",
              "app.js",
              "THIRD_PARTY_NOTICES.txt",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing public assets: {missing}")
          if 'https://progressive-ui9q.onrender.com' not in index:
              raise SystemExit("public API origin is not configured")
          if 'const API_ORIGIN = isPublicPagesSite' not in app:
              raise SystemExit("public API routing is not enabled")
          if 'src="/' in index or 'href="/styles.css"' in index:
              raise SystemExit("root-relative assets would break the project Pages path")

      - name: Validate immutable match viewer replay bundle
        run: python scripts/build_match_viewer_data.py --check

      # Pages may consume only the separately promoted, parent-source-bound
      # browser release. The gate also proves that the checked-in static mirror
      # is byte-identical before the site artifact is assembled.
      - name: Validate local certified browser engine release authority
        run: >-
          python scripts/build_browser_wasm_bundle.py
          --validate-existing src/scottish_progressive/web/static/engine
          --source-package src/scottish_progressive

      - name: Validate promoted browser engine release authority
        run: >-
          python scripts/validate_promoted_browser_wasm_release.py
          --repository .
          --release release/browser-wasm
          --source-package src/scottish_progressive
          > "$RUNNER_TEMP/engine-validation.json"

      - name: Build commit-addressed Pages artifact
        run: >-
          python scripts/build_pages_site.py
          --source src/scottish_progressive/web/static
          --output _site
          --version "$GITHUB_SHA"

      - name: Install promoted engine bytes into Pages artifact
        shell: python
        run: |
          from pathlib import Path
          import shutil

          site = Path("_site").resolve(strict=True)
          promoted = Path("release/browser-wasm/browser-engine").resolve(strict=True)
          target = site / "engine"
          if target.is_symlink() or target.resolve() != site / "engine":
              raise SystemExit("unsafe Pages engine target")
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(promoted, target)

      - name: Revalidate packaged Pages engine bytes
        run: >-
          python scripts/build_browser_wasm_bundle.py
          --validate-existing _site/engine
          --source-package src/scottish_progressive

      - name: Preserve exact historical replay after current engine authority
        shell: bash
        run: |
          if test -f archive-delivery.json; then
            python scripts/validate_archive_delivery.py --mode preserve --repository . --candidate-sha "$GITHUB_SHA" --site _site --anchor-validation "$RUNNER_TEMP/engine-validation.json" --attestation "$RUNNER_TEMP/archive-preservation.json"
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-archive:
    needs: classify
    if: needs.classify.outputs.archive_only == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout archive delivery
        uses: actions/checkout@v5
        with:
          path: candidate
          fetch-depth: 0
      - name: Checkout immutable promoted engine anchor
        uses: actions/checkout@v5
        with:
          path: anchor
          ref: f10f78bd2ee055b15194f104102ba03639f0d504
          fetch-depth: 2
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install existing validator dependencies
        run: python -m pip install --disable-pip-version-check python-chess==1.999 chess==1.11.2 pytest==8.4.2
      - name: Test replay-only delivery contract without engine imports
        working-directory: candidate
        run: python -m pytest tests/test_archive_delivery.py -q --confcutdir=tests
      - name: Validate exact archive-only change set
        run: >-
          python candidate/scripts/validate_archive_delivery.py
          --repository candidate --anchor anchor --candidate-sha "$GITHUB_SHA"
      - name: Validate anchor using its unchanged promotion authority
        working-directory: anchor
        shell: bash
        run: |
          GITHUB_SHA=f10f78bd2ee055b15194f104102ba03639f0d504 python scripts/validate_promoted_browser_wasm_release.py --repository . --release release/browser-wasm --source-package src/scottish_progressive > "$RUNNER_TEMP/anchor-validation.json"
          python scripts/build_browser_wasm_bundle.py --validate-existing src/scottish_progressive/web/static/engine --source-package src/scottish_progressive
      - name: Build unchanged commit-addressed anchor site
        working-directory: anchor
        run: >-
          python scripts/build_pages_site.py
          --source src/scottish_progressive/web/static
          --output "$RUNNER_TEMP/archive-site"
          --version f10f78bd2ee055b15194f104102ba03639f0d504
      - name: Add validated replay subtree and bind candidate provenance
        run: >-
          python candidate/scripts/validate_archive_delivery.py
          --repository candidate --anchor anchor --candidate-sha "$GITHUB_SHA"
          --site "$RUNNER_TEMP/archive-site"
          --anchor-validation "$RUNNER_TEMP/anchor-validation.json"
          --attestation "$RUNNER_TEMP/archive-delivery-attestation.json"
      - name: Revalidate unchanged packaged engine
        working-directory: anchor
        run: >-
          python scripts/build_browser_wasm_bundle.py
          --validate-existing "$RUNNER_TEMP/archive-site/engine"
          --source-package src/scottish_progressive
      - name: Preserve deployment provenance separately from website
        uses: actions/upload-artifact@v4
        with:
          name: actual-100games-archive-delivery-${{ github.sha }}
          path: |
            ${{ runner.temp }}/anchor-validation.json
            ${{ runner.temp }}/archive-delivery-attestation.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/archive-site
      - name: Deploy replay-only overlay
        id: deployment
        uses: actions/deploy-pages@v4
